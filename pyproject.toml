[project]
name = "macos-photos-cleanup"
version = "0.2.0"
description = "Review and clear unwanted photos in your macOS Photos library from a local browser UI. Never deletes: flagged photos go to a Delete Me album."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "khivi" }]
requires-python = ">=3.11"
classifiers = [
    "Environment :: Web Environment",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "osxphotos>=0.68",  # reads the library (photos_cleanup/library.py)
]

[project.urls]
Homepage = "https://github.com/khivi/photos-cleanup"
Issues = "https://github.com/khivi/photos-cleanup/issues"

# PyPI name differs from the command: "photo-cleanup" on PyPI is an unrelated tool
# that deletes files, one typo away from "photos-cleanup".
[project.scripts]
photos-cleanup = "photos_cleanup.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The UI is built by `pnpm build` into photos_cleanup/ui, which is gitignored, so it
# ships as an artifact.
[tool.hatch.build.targets.wheel]
packages = ["photos_cleanup"]
artifacts = ["photos_cleanup/ui/"]

[tool.hatch.build.targets.sdist]
include = ["photos_cleanup/", "README.md", "LICENSE"]
artifacts = ["photos_cleanup/ui/"]

[dependency-groups]
dev = [
    "pytest>=7",
    "httpx",          # required by fastapi TestClient
    "pre-commit>=3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
