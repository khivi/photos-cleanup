[project]
name = "photos-cleanup-sidecar"
version = "0.1.0"
description = "Local HTTP sidecar wrapping the photo_cleanup engine for the Tauri GUI."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "photo-cleanup",
]

# ponytail: local path dep to the sibling engine repo — never modifies it.
# Assumes the sibling layout Projects/photo-cleanup next to Projects/git/photos-cleanup.
[tool.uv.sources]
photo-cleanup = { path = "../../photo-cleanup" }

[dependency-groups]
dev = [
    "pytest>=7",
    "httpx",          # required by fastapi TestClient
    "pre-commit>=3",
    "pyinstaller>=6.21.0",
]

[tool.pytest.ini_options]
testpaths = ["sidecar"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
