[project]
name = "photos-cleanup"
version = "0.1.0"
description = "macOS Photos cleanup app: local FastAPI server + browser UI + vendored photo_cleanup engine."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "osxphotos>=0.68",  # the engine (photo_cleanup, vendored below) reads the library
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# One codebase: the vendored engine lives at ./photo_cleanup and installs from this
# same pyproject (no separate package, no external path dep).
[tool.hatch.build.targets.wheel]
packages = ["photo_cleanup"]

[dependency-groups]
dev = [
    "pytest>=7",
    "httpx",          # required by fastapi TestClient
    "pre-commit>=3",
]

[tool.pytest.ini_options]
testpaths = ["sidecar"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
