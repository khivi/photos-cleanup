name: tag

# When a commit to master changes the version, push `v<version>` and cut its
# GitHub Release. The tag fires publish.yml (PyPI, then the Homebrew tap bump).
#
# The tag is pushed with HOMEBREW_TAP_TOKEN, not GITHUB_TOKEN: a ref pushed by
# GITHUB_TOKEN does not trigger other workflows (GitHub's recursion guard), so
# publish.yml would silently never run. The PAT needs Contents: write on this
# repo and on khivi/homebrew-photos-cleanup (bump-tap in publish.yml uses it).
#
# Idempotent: an existing tag skips the push, an existing Release skips the
# create. `gh release create` on a pushed tag publishes no ref, so it cannot
# re-fire publish.yml; that matters because PyPI refuses a re-upload. The
# Release step runs even when the tag exists, so a run that tagged but failed
# to release backfills the notes.

on:
  push:
    branches: [master]
    paths: ["pyproject.toml"]

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Push v<version> tag and cut its Release, if missing
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          v="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"

          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null 2>&1; then
            echo "v$v already tagged"
          else
            echo "tagging v$v at $GITHUB_SHA"
            git tag "v$v"
            git push origin "v$v"
          fi

          if gh release view "v$v" >/dev/null 2>&1; then
            echo "release v$v already exists"
          else
            echo "creating release v$v"
            gh release create "v$v" --verify-tag --title "v$v" --generate-notes
          fi
