name: release

# When a commit to master changes CFBundleShortVersionString in the app's
# Info.plist (or on a manual run): build the universal app, sign it with
# Developer ID, notarize and staple it, create the GitHub Release v<version>
# with the zip attached, then write the cask in the Homebrew tap.
#
# Idempotent: if release v<version> exists, the whole job after the check is
# skipped. To redo a release, delete the release and the tag first.
#
# Repo secret HOMEBREW_TAP_TOKEN (the fine-grained PAT shared with cockpit)
# is used only for the tap. It needs Contents: write on
# khivi/homebrew-photos-cleanup.
#
# Signing secrets, all from fnox profile `cockpit`: MACOS_CERT_P12 (base64
# .p12, Developer ID Application: Amit Khivesara (3WD7XPJ5M5)),
# MACOS_CERT_PASSWORD, and the App Store Connect API key NOTARY_KEY_P8
# (base64), NOTARY_KEY_ID, NOTARY_ISSUER_ID.

on:
  push:
    branches: [master]
    paths: ["Sources/PhotosCleanupApp/Info.plist"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # xcode-27 (preview) has the macOS 27 SDK; on macos-latest the app would
    # ship without Foundation Models verdicts.
    runs-on: xcode-27
    permissions:
      contents: write # create the tag and Release with GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v7

      - name: Read version and skip if already released
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Sources/PhotosCleanupApp/Info.plist)"
          if [ -z "$v" ]; then
            echo "::error::could not read CFBundleShortVersionString"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "release v$v already exists"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build, sign, notarize and staple the app
        if: steps.ver.outputs.skip == 'false'
        id: pkg
        env:
          V: ${{ steps.ver.outputs.version }}
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          k="$RUNNER_TEMP/signing"
          mkdir -p "$k"
          kc="$k/ci.keychain-db"
          kcpw="$(uuidgen)"
          printf %s "$MACOS_CERT_P12" | base64 -d > "$k/cert.p12"
          printf %s "$NOTARY_KEY_P8" | base64 -d > "$k/key.p8"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$k/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')

          SIGN_IDENTITY="Developer ID Application: Amit Khivesara (3WD7XPJ5M5)" KEYCHAIN="$kc" \
            scripts/app.sh --universal
          app=".build/Photos Cleanup.app"
          bin="$app/Contents/MacOS/PhotosCleanupApp"
          codesign --verify --deep --strict "$app"
          codesign -dv "$app" 2>&1 | grep -q "TeamIdentifier=3WD7XPJ5M5"
          codesign -d --entitlements - "$app" 2>&1 | grep -q "personal-information.photos-library"
          lipo -archs "$bin" | grep -q x86_64 && lipo -archs "$bin" | grep -q arm64
          # Never ship a build without AI verdicts (an SDK older than macOS 27).
          strings "$bin" | grep -q "photo library and decide whether each is still worth keeping"

          ditto -c -k --keepParent "$app" "$k/notarize.zip"
          xcrun notarytool submit "$k/notarize.zip" --wait --output-format json \
            --key "$k/key.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" > "$k/result.json"
          cat "$k/result.json"
          if [ "$(jq -r .status "$k/result.json")" != "Accepted" ]; then
            xcrun notarytool log "$(jq -r .id "$k/result.json")" \
              --key "$k/key.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" || true
            echo "::error::notarization was not accepted"
            exit 1
          fi
          xcrun stapler staple "$app"
          spctl -a -vv "$app"

          out="Photos-Cleanup-$V.zip"
          ditto -c -k --keepParent "$app" "$out"
          echo "zip=$out" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$out" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing/ci.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/signing"

      - name: Create tag and GitHub Release
        if: steps.ver.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.version }}
          ZIP: ${{ steps.pkg.outputs.zip }}
        run: |
          gh release create "v$V" "$ZIP" \
            --target "$GITHUB_SHA" --title "v$V" --generate-notes

      # The cask is written whole from here, so this repo holds its only copy.
      # The old formula of the same name goes: brew would prefer it over the cask.
      - name: Write the Homebrew cask
        if: steps.ver.outputs.skip == 'false'
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          V: ${{ steps.ver.outputs.version }}
          SHA: ${{ steps.pkg.outputs.sha256 }}
        run: |
          git clone -q "https://x-access-token:$TOKEN@github.com/khivi/homebrew-photos-cleanup.git" tap
          cd tap
          mkdir -p Casks
          cat > Casks/photos-cleanup.rb <<EOF
          # Homebrew cask for Photos Cleanup. Written by the release workflow in
          # khivi/photos-cleanup on every release; don't edit it here.
          cask "photos-cleanup" do
            version "$V"
            sha256 "$SHA"

            url "https://github.com/khivi/photos-cleanup/releases/download/v#{version}/Photos-Cleanup-#{version}.zip"
            name "Photos Cleanup"
            desc "Review and clear unwanted photos in the Photos library"
            homepage "https://github.com/khivi/photos-cleanup"

            depends_on macos: :sequoia

            app "Photos Cleanup.app"

            zap trash: [
              "~/Library/Application Support/photos-cleanup",
              "~/Library/Caches/photos-cleanup",
            ]
          end
          EOF
          git rm -q --ignore-unmatch Formula/photos-cleanup.rb
          git add Casks/photos-cleanup.rb
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "photos-cleanup $V (cask)"
          git push -q
