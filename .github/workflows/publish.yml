name: publish

# On a pushed `v<version>` tag: build the UI + sdist + wheel, publish to PyPI
# as `macos-photos-cleanup` (console script `photos-cleanup`), then bump the
# Homebrew tap to the new sdist.
#
# The tag must match pyproject.toml: a mismatch is unrecoverable because PyPI
# refuses a re-upload of a version.
#
# PyPI Trusted Publishing (OIDC), no API token. One-time setup (owner only):
#   1. https://pypi.org/manage/account/publishing/ -> "Add a new pending publisher"
#   2. PyPI project name: macos-photos-cleanup
#   3. Owner: khivi   Repository: photos-cleanup   Workflow: publish.yml   Environment: pypi
# PyPI creates the project on the first successful publish.
#
# Repo secret HOMEBREW_TAP_TOKEN: PAT with Contents: write on this repo and
# khivi/homebrew-photos-cleanup (also used by tag.yml).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches pyproject version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tag="${TAG#v}"
          proj="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag=$tag pyproject=$proj"
          if [ "$tag" != "$proj" ]; then
            echo "::error::tag v$tag does not match pyproject.toml version $proj; bump pyproject before tagging"
            exit 1
          fi

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # package.json has no `packageManager`, so pin the major here.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: uv build

      # The UI is gitignored; without this check a build that skipped
      # `pnpm build` would publish a broken, unreplaceable wheel.
      - name: Wheel contains the UI
        run: unzip -l dist/*.whl | grep -q photos_cleanup/ui/index.html

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  bump-tap:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      # The PyPI sdist, not the GitHub tag tarball: the tarball lacks the
      # built UI. The hashed URL from PyPI's JSON API (not the predictable
      # /packages/source/ one) is what `brew style` accepts in the formula.
      # PyPI's API and CDN can lag the upload by seconds, so retry until the
      # file itself answers 200.
      - name: Resolve sdist URL and wait for PyPI
        id: sdist
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          for i in $(seq 1 30); do
            url="$(curl -fsSL "https://pypi.org/pypi/macos-photos-cleanup/${v}/json" \
              | jq -r '.urls[] | select(.packagetype=="sdist") | .url' || true)"
            if [ -n "$url" ] && [ "$(curl -s -o /dev/null -w '%{http_code}' -L "$url")" = 200 ]; then
              echo "sdist: $url"
              echo "url=$url" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "attempt $i: not ready"
            sleep 10
          done
          echo "::error::sdist for $v never appeared on PyPI"
          exit 1

      - uses: mislav/bump-homebrew-formula-action@v4
        with:
          formula-name: photos-cleanup
          homebrew-tap: khivi/homebrew-photos-cleanup
          download-url: ${{ steps.sdist.outputs.url }}
          create-branch: false
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
