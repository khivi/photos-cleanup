name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# macOS runner: osxphotos and its pyobjc deps install only there.
# swift-typecheck is skipped: verdict.swift imports FoundationModels (macOS 27
# SDK), which GitHub runners do not have yet. Remove once they ship it.
# no-commit-to-branch (if added) would fail on push-to-master runs.
env:
  SKIP: "swift-typecheck,no-commit-to-branch"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # package.json has no `packageManager`, so pin the major here.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      # The tsc hook needs node_modules; the pytest hook needs the uv env.
      - run: pnpm install --frozen-lockfile
      - run: uv sync

      - name: Pre-commit hooks
        run: uv run --with pre-commit pre-commit run --all-files

      - name: Pre-push hooks (pytest, uv audit)
        run: uv run --with pre-commit pre-commit run --all-files --hook-stage pre-push

      - name: Build UI and package
        run: |
          pnpm build
          uv build

      # Vite writes the UI into photos_cleanup/ui (gitignored, hatch artifact).
      # A wheel without it installs but serves a blank page.
      - name: Wheel contains the UI
        run: unzip -l dist/*.whl | grep -q photos_cleanup/ui/index.html
