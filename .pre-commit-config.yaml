# Conventions mirror the Cockpit repo. pre-push hooks need `pre-commit install` (installs both types).
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # actionlint checks that a workflow is correct, zizmor that it is safe: release.yml
  # holds the Developer ID certificate, the notary key and HOMEBREW_TAP_TOKEN.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.50.0
    hooks:
      - id: markdownlint
        args: ['--config', '.markdownlint.yaml']

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: ['--config', '.codespellrc']

  - repo: local
    hooks:
      # The spike probes are standalone scripts outside the package; swift-build checks the package.
      # One file per swiftc call: given several files, swiftc only allows top-level code in
      # main.swift. A probe with `@main` needs -parse-as-library; a top-level script must not have it.
      - id: swift-typecheck
        name: swiftc -typecheck (spike/)
        entry: bash -c 'for f in "$@"; do lib=(); grep -q "^@main" "$f" && lib=(-parse-as-library); swiftc -typecheck "${lib[@]}" "$f" || exit 1; done' --
        language: system
        types: [swift]
        files: ^spike/

      # The Swift package (Core, the app, tests) builds as a whole.
      - id: swift-build
        name: swift build (with tests)
        entry: swift build --build-tests
        language: system
        files: ^(Sources|Tests)/.*\.swift$|^Package\.swift$
        pass_filenames: false

      # The full test run; too slow for every commit, so pre-push only.
      - id: swift-test
        name: swift test
        entry: swift test
        language: system
        types: [swift]
        pass_filenames: false
        stages: [pre-push]
