# Conventions mirror the Cockpit repo. pre-push hooks need `pre-commit install` (installs both types).
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.20.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^tsconfig.*\.json$  # tsconfigs are JSONC (comments)
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.43.0
    hooks:
      - id: markdownlint
        args: ['--config', '.markdownlint.yaml']

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args: ['--config', '.codespellrc']

  - repo: local
    hooks:
      - id: tsc
        name: tsc (UI type check)
        entry: pnpm exec tsc --noEmit
        language: system
        types_or: [ts, tsx]
        pass_filenames: false

      # Nothing else compiles the helpers before the server runs them. One file per swiftc
      # call: each helper is a standalone script, and given several files swiftc only allows
      # top-level code in main.swift.
      - id: swift-typecheck
        name: swiftc -typecheck
        entry: bash -c 'for f in "$@"; do swiftc -typecheck "$f" || exit 1; done' --
        language: system
        types: [swift]
        # The Swift package's files only compile together; swift-build checks them.
        exclude: ^(spike|Sources|Tests)/|^Package\.swift$

      # The Swift package (server, Core, tests) builds as a whole.
      - id: swift-build
        name: swift build (with tests)
        entry: swift build --build-tests
        language: system
        files: ^(Sources|Tests)/.*\.swift$|^Package\.(swift|resolved)$
        pass_filenames: false

      # The full test run; too slow for every commit, so pre-push only.
      - id: swift-test
        name: swift test
        entry: swift test
        language: system
        types: [swift]
        pass_filenames: false
        stages: [pre-push]
